<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Private JSON Formatter & Validator - Zero Server Upload - Zenith Growth</title>
  <meta name="description" content="Format, beautify, minify, and validate JSON completely offline in your browser. 100% private, no logging, no external server transmission.">
  <link rel="canonical" href="https://zenithgrowth.tech/json-formatter.html">

  <meta property="og:title" content="Private JSON Formatter & Validator - Zenith Growth">
  <meta property="og:description" content="Validate and beautify JSON client-side with zero risk of confidential data leakage.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://zenithgrowth.tech/json-formatter.html">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="logo.png">
  <meta property="og:image" content="https://zenithgrowth.tech/logo.png">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans antialiased">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center gap-2 text-xl font-extrabold tracking-tight text-slate-900">
        <img src="logo.png" alt="Zenith Flow Growth" class="h-9 w-auto rounded-lg shadow-xs object-contain">
        <span>Zenith<span class="text-emerald-600">Growth</span></span>
      </a>
      <a href="index.html" class="text-xs font-semibold text-slate-600 hover:text-slate-900 transition">← All Tools</a>
    </div>
  </header>

  <!-- Workspace -->
  <main class="flex-1 max-w-6xl mx-auto px-4 sm:px-6 py-8 w-full flex flex-col">
    <div class="mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-black text-slate-900">Private JSON Formatter & Validator</h1>
        <p class="text-slate-500 text-xs mt-1">Processed 100% in your browser. Sensitive keys & database dumps never leave your machine.</p>
      </div>
      <!-- Actions Bar -->
      <div class="flex flex-wrap items-center gap-2">
        <button onclick="formatJSON(2)" class="px-3.5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs transition shadow-xs">
          Beautify (2 Spaces)
        </button>
        <button onclick="formatJSON(4)" class="px-3.5 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs transition">
          4 Spaces
        </button>
        <button onclick="minifyJSON()" class="px-3.5 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs transition">
          Minify
        </button>
        <button onclick="copyToClipboard()" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-xs font-medium transition shadow-xs">
          📋 Copy
        </button>
        <button onclick="clearEditor()" class="px-3.5 py-2 rounded-xl bg-white border border-slate-300 hover:bg-slate-50 text-slate-500 text-xs font-medium transition">
          Clear
        </button>
      </div>
    </div>

    <!-- Error / Status Notice -->
    <div id="status_bar" class="hidden mb-4 p-3 rounded-xl text-xs font-mono"></div>

    <!-- Editor Container -->
    <div class="flex-1 min-h-[480px] bg-white border border-slate-300 rounded-3xl overflow-hidden shadow-xs flex flex-col">
      <div class="bg-slate-50 px-4 py-2.5 border-b border-slate-200 flex justify-between items-center text-xs text-slate-500">
        <span class="font-mono font-bold">Input Payload</span>
        <span id="char_count" class="font-mono">0 chars</span>
      </div>
      <textarea id="json_input" oninput="updateCharCount()" placeholder="Paste raw JSON here..." class="flex-1 p-4 bg-transparent text-slate-800 font-mono text-sm leading-relaxed outline-none resize-none placeholder-slate-400"></textarea>
    </div>
  </main>

  <footer class="border-t border-slate-200 bg-white py-6 text-xs text-slate-500 text-center">
    <div class="max-w-7xl mx-auto px-4 flex justify-between items-center">
      <span>© 2026 Zenith Growth (zenithgrowth.tech)</span>
      <div class="flex gap-4">
        <a href="privacy.html" class="hover:text-slate-800">Privacy Policy</a>
        <a href="terms.html" class="hover:text-slate-800">Terms</a>
      </div>
    </div>
  </footer>

  <script>
    function updateCharCount() {
      const text = document.getElementById("json_input").value;
      document.getElementById("char_count").textContent = `${text.length.toLocaleString()} chars`;
    }

    function showStatus(message, isError) {
      const bar = document.getElementById("status_bar");
      bar.classList.remove("hidden", "bg-rose-100", "text-rose-800", "border-rose-300", "bg-emerald-100", "text-emerald-800", "border-emerald-300");
      bar.classList.add("border");
      if (isError) {
        bar.classList.add("bg-rose-100", "text-rose-800", "border-rose-300");
        bar.textContent = `❌ ${message}`;
      } else {
        bar.classList.add("bg-emerald-100", "text-emerald-800", "border-emerald-300");
        bar.textContent = `✓ ${message}`;
      }
    }

    function formatJSON(indent) {
      const editor = document.getElementById("json_input");
      const raw = editor.value.trim();
      if (!raw) return;

      try {
        const parsed = JSON.parse(raw);
        editor.value = JSON.stringify(parsed, null, indent);
        showStatus("Valid JSON successfully formatted.", false);
        updateCharCount();
      } catch (err) {
        showStatus(`Invalid JSON Syntax: ${err.message}`, true);
      }
    }

    function minifyJSON() {
      const editor = document.getElementById("json_input");
      const raw = editor.value.trim();
      if (!raw) return;

      try {
        const parsed = JSON.parse(raw);
        editor.value = JSON.stringify(parsed);
        showStatus("JSON successfully minified.", false);
        updateCharCount();
      } catch (err) {
        showStatus(`Invalid JSON Syntax: ${err.message}`, true);
      }
    }

    function copyToClipboard() {
      const editor = document.getElementById("json_input");
      if (!editor.value) return;
      navigator.clipboard.writeText(editor.value).then(() => {
        showStatus("Copied formatted JSON to clipboard!", false);
      });
    }

    function clearEditor() {
      document.getElementById("json_input").value = "";
      document.getElementById("status_bar").classList.add("hidden");
      updateCharCount();
    }
  </script>
</body>
</html>
