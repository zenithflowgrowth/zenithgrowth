  <script>
    let compFile = null;
    let compBytes = null;
    let compDoc = null;
    let totalPages = 0;
    let lastCompressedBlob = null;

    async function loadSamplePdf() {
      try {
        const { PDFDocument, rgb, StandardFonts } = PDFLib;
        const pdfDoc = await PDFDocument.create();
        const font = await pdfDoc.embedFont(StandardFonts.Helvetica);
        const fontBold = await pdfDoc.embedFont(StandardFonts.HelveticaBold);
        
        const page = pdfDoc.addPage([595.28, 841.89]); // A4 standard
        const { width, height } = page.getSize();
        
        // Header
        page.drawRectangle({
          x: 40,
          y: height - 100,
          width: width - 80,
          height: 60,
          color: rgb(0.06, 0.09, 0.16)
        });
        
        page.drawText('ZENITH GROWTH — SAMPLE AGREEMENT', {
          x: 60,
          y: height - 70,
          size: 16,
          font: fontBold,
          color: rgb(1, 1, 1)
        });
        
        page.drawText('High-DPI In-Browser Compression Benchmark Document', {
          x: 60,
          y: height - 88,
          size: 10,
          font: font,
          color: rgb(0.06, 0.72, 0.5)
        });
        
        for (let i = 0; i < 22; i++) {
          page.drawText(`Clause ${i + 1}.0 — Confidential Document Verification & Zero Server Uploads`, {
            x: 50,
            y: height - 135 - (i * 26),
            size: 10,
            font: fontBold,
            color: rgb(0.1, 0.15, 0.25)
          });
          page.drawText(`This contract section confirms local WebAssembly execution in the browser. Letters stay crisp under extreme compression down to kilobytes.`, {
            x: 50,
            y: height - 148 - (i * 26),
            size: 8,
            font: font,
            color: rgb(0.4, 0.45, 0.55)
          });
        }
        
        const pdfBytes = await pdfDoc.save();
        const sampleFile = new File([pdfBytes], 'sample-agreement.pdf', { type: 'application/pdf' });
        handleCompressFile(sampleFile);
      } catch (err) {
        console.error('Error generating sample PDF:', err);
        alert('Could not generate sample PDF. Please upload a PDF file.');
      }
    }

    async function handleCompressFile(file) {
      if (!file || !file.name.toLowerCase().endsWith('.pdf')) {
        alert('Please select a valid PDF file.');
        return;
      }
      compFile = file;
      compBytes = await file.arrayBuffer();

      document.getElementById('compress_upload_zone').classList.add('hidden');
      document.getElementById('compress_config_panel').classList.remove('hidden');
      document.getElementById('doc_name_label').textContent = file.name;

      const loadingTask = pdfjsLib.getDocument({ data: compBytes.slice(0) });
      compDoc = await loadingTask.promise;
      totalPages = compDoc.numPages;

      const sizeMb = (file.size / (1024 * 1024)).toFixed(2);
      document.getElementById('doc_size_label').textContent = `Original Size: ${sizeMb} MB (${totalPages} pages)`;

      // Render live sharpness preview sample of Page 1
      renderClarityPreview();
    }

    
    // Animated Drag & Drop Glow
    const compDropZone = document.getElementById('compress_upload_zone');
    if (compDropZone) {
      ['dragenter', 'dragover'].forEach(evt => {
        compDropZone.addEventListener(evt, (e) => {
          e.preventDefault();
          compDropZone.classList.add('border-emerald-500', 'bg-emerald-50/30', 'scale-[1.01]', 'shadow-lg');
        });
      });
      ['dragleave', 'drop'].forEach(evt => {
        compDropZone.addEventListener(evt, (e) => {
          e.preventDefault();
          compDropZone.classList.remove('border-emerald-500', 'bg-emerald-50/30', 'scale-[1.01]', 'shadow-lg');
        });
      });
      compDropZone.addEventListener('drop', (e) => {
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleCompressFile(e.dataTransfer.files[0]);
        }
      });
    }

    function toggleDarkMode() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    }

    function onLevelChange() {
      const radio = document.querySelector('input[name="comp_level"]:checked');
      ['recommended', 'low', 'extreme'].forEach(lvl => {
        const card = document.getElementById(`card_${lvl}`);
        if (radio.value === lvl) {
          card.className = "p-4 rounded-2xl border-2 border-emerald-500 bg-emerald-50/40 cursor-pointer transition flex flex-col justify-between";
        } else {
          card.className = "p-4 rounded-2xl border-2 border-slate-200 hover:border-emerald-500 cursor-pointer bg-slate-50/50 transition flex flex-col justify-between";
        }
      });
      renderClarityPreview();
    }

    // High-DPI Settings that ensure sharp letters
    function getCompressionParams() {
      const level = document.querySelector('input[name="comp_level"]:checked').value;
      if (level === 'extreme') {
        // 130 DPI with good quality JPEG
        return { scale: 1.8, quality: 0.68 };
      } else if (level === 'recommended') {
        // 160 DPI - Crisp, clear, perfectly readable text
        return { scale: 2.2, quality: 0.78 };
      } else {
        // 195 DPI - Print-grade sharpness
        return { scale: 2.7, quality: 0.88 };
      }
    }

    async function renderClarityPreview() {
      if (!compDoc) return;
      const { scale, quality } = getCompressionParams();
      const page = await compDoc.getPage(1);
      
      const viewport = page.getViewport({ scale: scale });
      const tempCanvas = document.createElement('canvas');
      tempCanvas.width = viewport.width;
      tempCanvas.height = viewport.height;
      const ctx = tempCanvas.getContext('2d');

      await page.render({
        canvasContext: ctx,
        viewport: viewport
      }).promise;

      // Simulate the exact JPEG compression
      const jpegDataUrl = tempCanvas.toDataURL('image/jpeg', quality);

      // Display sample on clarity preview canvas
      const img = new Image();
      img.onload = () => {
        const previewCanvas = document.getElementById('clarity_preview_canvas');
        previewCanvas.width = img.width;
        previewCanvas.height = img.height;
        const pctx = previewCanvas.getContext('2d');
        pctx.drawImage(img, 0, 0);
        document.getElementById('clarity_loading_text').classList.add('hidden');
      };
      img.src = jpegDataUrl;
    }

    async function executeCompression() {
      const btn = document.getElementById('compress_btn');
      const progressWrapper = document.getElementById('progress_wrapper');
      const progressBar = document.getElementById('progress_bar');
      const progressStatus = document.getElementById('progress_status');
      const progressPercent = document.getElementById('progress_percent');
      const resultCard = document.getElementById('result_card');

      const { scale, quality } = getCompressionParams();

      btn.disabled = true;
      progressWrapper.classList.remove('hidden');
      resultCard.classList.add('hidden');

      try {
        const { PDFDocument } = PDFLib;
        const newPdfDoc = await PDFDocument.create();

        for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
          progressStatus.textContent = `Optimizing page ${pageNum} of ${totalPages} with sharp text...`;
          const pct = Math.round((pageNum / totalPages) * 100);
          progressBar.style.width = `${pct}%`;
          progressPercent.textContent = `${pct}%`;

          const page = await compDoc.getPage(pageNum);
          const viewport = page.getViewport({ scale: scale });

          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');

          // High quality image smoothing
          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          await page.render({
            canvasContext: ctx,
            viewport: viewport
          }).promise;

          // High-DPI JPEG quantization
          const jpegDataUrl = canvas.toDataURL('image/jpeg', quality);
          const res = await fetch(jpegDataUrl);
          const jpegBytes = await res.arrayBuffer();

          const embeddedImage = await newPdfDoc.embedJpg(jpegBytes);
          const unscaledViewport = page.getViewport({ scale: 1.0 });

          // Embed high-DPI image into standard coordinate space (super-sampled Retina effect)
          const newPage = newPdfDoc.addPage([unscaledViewport.width, unscaledViewport.height]);
          newPage.drawImage(embeddedImage, {
            x: 0,
            y: 0,
            width: unscaledViewport.width,
            height: unscaledViewport.height
          });
        }

        progressStatus.textContent = "Finalizing sharp PDF document...";
        const newPdfBytes = await newPdfDoc.save({ useObjectStreams: true });
        lastCompressedBlob = new Blob([newPdfBytes], { type: 'application/pdf' });

        const origSizeMb = (compFile.size / (1024 * 1024)).toFixed(2);
        const newSizeMb = (lastCompressedBlob.size / (1024 * 1024)).toFixed(2);
        const savedPercent = Math.max(0, Math.round(((compFile.size - lastCompressedBlob.size) / compFile.size) * 100));

        document.getElementById('res_orig_size').textContent = `${origSizeMb} MB`;
        document.getElementById('res_new_size').textContent = `${newSizeMb} MB`;
        document.getElementById('res_saved_badge').textContent = `-${savedPercent}% Saved`;

        document.getElementById('res_download_btn').onclick = () => {
          const downloadUrl = URL.createObjectURL(lastCompressedBlob);
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = `sharp_compressed_${compFile.name}`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };

        resultCard.classList.remove('hidden');
        progressWrapper.classList.add('hidden');
      } catch (err) {
        alert('Error during compression: ' + err.message);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
